<!DOCTYPE html>
<html>
<head>

<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec4 vPosition;
void
main()
{
    gl_Position = vPosition;
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
precision mediump float;
uniform float r;
uniform float g;
uniform float b;

void
main()
{
    gl_FragColor = vec4( r / 255.0, g / 255.0, b / 255.0, 1.0 );
}
</script>

<script type="text/javascript" src="../Common/webgl-utils.js"></script>
<script type="text/javascript" src="../Common/initShaders.js"></script>
<script type="text/javascript" src="../Common/MV.js"></script>
<script type="text/javascript" src="carpet.js"></script>
</head>

<body>
<canvas id="gl-canvas" width="512" height="512">
Oops ... your browser doesn't support the HTML5 canvas element
</canvas>
<div>
Depth: <span id="depth_value">5</span>
<br>0 <input id="depth" type="range" min="0" max="7" value="5"> 7
</div>

Color Sliders
<div>
R: <span id="r_value">0</span>
<br>
0 <input id="r" type="range" min="0" max="255" value="0"> 255
</div>

<div>

<br>
0 <input id="g" type="range" min="0" max="255" value="0"> 255
</div>

<div>

<br>
0 <input id="b" type="range" min="0" max="255" value="0"> 255
</div>

</body>
</html>
