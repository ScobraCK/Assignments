<!DOCTYPE html>
<html>
<head>

<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec4 vPosition;
uniform vec2 A;
uniform vec2 B;

void
main()
{   
    // AI was used to generate math for M
    vec2 center = (A + B) / 2.0;
    vec2 diagonal = (A - B) / 2.0;
    vec2 perpendicular = vec2(diagonal.y, -diagonal.x);
    vec2 xAxis = perpendicular - diagonal;
    vec2 yAxis = perpendicular + diagonal;

    mat3 M = mat3(
        xAxis.x, xAxis.y, 0.0,
        yAxis.x, yAxis.y, 0.0,
        center.x - perpendicular.x, center.y - perpendicular.y, 1.0
    );
    gl_Position = vec4((M * vec3(vPosition.xy, 1.0)).xy, 0.0, 1.0);  //vPosition is vec4. use vPosition.xy
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
precision mediump float;
uniform float r;
uniform float g;
uniform float b;

void
main()
{
    gl_FragColor = vec4( r / 255.0, g / 255.0, b / 255.0, 1.0 );
}
</script>

<script type="text/javascript" src="../Common/webgl-utils.js"></script>
<script type="text/javascript" src="../Common/initShaders.js"></script>
<script type="text/javascript" src="../Common/MV.js"></script>
<script type="text/javascript" src="carpet.js"></script>
</head>
